name: Feature request
description: Propose a change to parsing, rendering, diffing, or an integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that infradiff does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should infradiff do, and which input or command would use it?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docker Compose
        - Terraform
        - Kubernetes
        - Mermaid output
        - JSON output
        - HTML output
        - Diff engine
        - MCP server
        - GitHub Action
        - VS Code extension
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools or workarounds you tried
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps infradiff offline and does not require a hosted service
          required: true
