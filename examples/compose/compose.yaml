name: notes

services:
  web:
    image: ghcr.io/example/notes:1.4.0
    ports:
      - "8080:8080"
    environment:
      APP_SECRET: change-me
    depends_on:
      - api

  api:
    image: ghcr.io/example/notes-api:1.4.0
    environment:
      DATABASE_URL: postgres://notes:notes@db:5432/notes
      CACHE_URL: redis://cache:6379
    depends_on:
      - db
      - cache

  db:
    image: postgres:16.4
    volumes:
      - db-data:/var/lib/postgresql/data

  cache:
    image: redis:7.4

volumes:
  db-data:
