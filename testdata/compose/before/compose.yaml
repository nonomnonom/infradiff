name: shop

services:
  api:
    image: shop/api:1
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - backend

  worker:
    image: shop/worker:1
    networks:
      - backend

  db:
    image: postgres:16
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:

volumes:
  dbdata:
